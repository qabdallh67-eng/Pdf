name: Export repository to one PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-pdf.yml'
      - 'scripts/export_repo_pdf.py'
      - '**'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Arabic fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          pip install reportlab arabic-reshaper python-bidi
      - name: Generate one complete PDF
        run: python scripts/export_repo_pdf.py
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pdf-Complete-Repository
          path: Pdf-Complete-Repository.pdf
          if-no-files-found: error
          retention-days: 30
